# Gradle build memory settings -----------------------------------------------
# Cap the Gradle daemon JVM at 4 GB so builds never exceed 3-4 GB of RAM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# Limit parallel workers to keep peak memory usage low.
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true

